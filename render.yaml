databases:
  - name: myqr-db
    plan: free
    databaseName: dynamic_qr
    user: myqr

services:
  - type: web
    name: myqr
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: myqr-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@example.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_NAME
        value: Administrator
